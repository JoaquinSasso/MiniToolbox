[versions]
agp = "9.3.2"
composeQrCode = "1.0.1"
datastorePreferences = "1.1.7"
kotlin = "2.2.20"
kotlinxCoroutinesTest = "1.10.1"
coreKtx = "1.17.0"
junit = "4.13.2"
json = "20260814"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
workTesting = "2.10.5"
mockito = "5.23.0"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kotlinxSerializationJson = "1.9.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
glance = "1.2.0"
material = "1.14.0"
media3Session = "1.11.0"
navigationCompose = "2.10.0"
protobufJava = "4.32.1"
gson = "2.13.2"
cameraX = "1.5.0"
uiUnit = "1.9.1"
reorderable = "3.0.0"
sceneview = "2.3.0"
arcore = "1.50.0"
ossLicenses = "17.5.1"
ossLicensesPlugin = "0.13.0"
# Ads / Consent
gma = "25.4.0"
ump = "4.0.0"
guava = "33.7.1-android"
# Mediation adapters (usa las últimas de cada partner)
admob-unity = "4.20.0.1"      # com.google.ads.mediation:unity
admob-meta  = "6.22.0.0"      # com.google.ads.mediation:facebook

metaSdk = "6.22.0"
unitySdk = "4.20.0"

runtimeSaveable = "1.9.1"
billing = "9.1.0"
androidx-browser = "1.8.0"
appcompat = "1.7.1"
fragmentKtx = "1.8.9"
media = "1.7.1"
work = "2.10.5"
uiGraphics = "1.9.3"

googleServices = "4.5.0"
firebaseBom = "34.18.0"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Session" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3Session" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
compose-qr-code = { module = "com.lightspark:compose-qr-code", version.ref = "composeQrCode" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workTesting" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
# BOM alpha: material3 1.5.x trae la API expresiva (CircularWavyProgressIndicator),
# usada en la animación del Pomodoro. Las variantes alpha/beta/estable del BOM comparten
# numeración, y lo importante es que TODAS las librerías de Compose salgan de la misma:
# mezclar material3 alpha con foundation estable produce AbstractMethodError en runtime.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
material = { module = "com.google.android.material:material", version.ref = "material" }
# Sin version.ref a proposito: la version la fija el BOM de Compose.
material3 = { module = "androidx.compose.material3:material3" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobufJava" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraX" }
androidx-ui-unit = { group = "androidx.compose.ui", name = "ui-unit", version.ref = "uiUnit" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
arsceneview = { module = "io.github.sceneview:arsceneview", version.ref = "sceneview" }
arcore = { module = "com.google.ar:core", version.ref = "arcore" }
play-services-oss-licenses = { module = "com.google.android.gms:play-services-oss-licenses", version.ref = "ossLicenses" }

# Ads + Consent
google-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "gma" }
google-ump = { module = "com.google.android.ump:user-messaging-platform", version.ref = "ump" }
guava-android = { module = "com.google.guava:guava", version.ref = "guava" }
androidx-runtime-saveable = { group = "androidx.compose.runtime", name = "runtime-saveable", version.ref = "runtimeSaveable" }
# Mediation adapters
admob-unity = { module = "com.google.ads.mediation:unity", version.ref = "admob-unity" }
admob-meta = { module = "com.google.ads.mediation:facebook", version.ref = "admob-meta" }
# Meta + Unity Ads SDKs
meta-sdk = { module = "com.facebook.android:audience-network-sdk", version.ref = "metaSdk" }
unity-sdk = { module = "com.unity3d.ads:unity-ads", version.ref = "unitySdk" }

billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "media" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
# Sin version.ref: alineado por el BOM, igual que material3 y foundation.
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "uiGraphics" }

# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
firebase-appcheck-debug = { module = "com.google.firebase:firebase-appcheck-debug" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.2.10" }
oss-licenses = { id = "com.google.android.gms.oss-licenses-plugin", version.ref = "ossLicensesPlugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }