name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Si se pushea varias veces seguidas a la misma rama, cancela las corridas
# anteriores que todavía estén en curso. Solo interesa el resultado del
# último commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # Cachea las sombras de Android SDK descargadas por Robolectric (~150MB)
      # evitando descargas recurrentes en cada ejecución de tests.
      - name: Cache Robolectric jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('app/src/test/resources/robolectric.properties') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      # Ejecución aislada de tests unitarios: no requiere empaquetar APK ni correr Lint,
      # logrando un ciclo de feedback veloz (~1m).
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --build-cache

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # Ensamble del APK de debug y análisis estático de Lint ejecutados en paralelo con los tests.
      - name: Build APK and Lint
        run: ./gradlew assembleDebug lintDebug --build-cache

      - name: Upload Lint Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

# FUTURE CONSIDERATIONS:
# 1. Instrumented Tests: Postponed as they require an emulator and today none are written.
# 2. Release Job: Requires deciding on secret management for the keystore.
# 3. Code Coverage: Verification of coverage (Jacoco/Kover) to be added in the future.
#
# NOTE: This workflow MUST work without keystore.properties. If it fails, check signingConfigs in build.gradle.kts.