name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Configuration cache is enabled in gradle.properties.
          # If it causes issues in CI, it should be investigated rather than disabled.
          gradle-version: wrapper

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

# FUTURE CONSIDERATIONS:
# 1. Instrumented Tests: Postponed as they require an emulator and today none are written.
# 2. Release Job: Requires deciding on secret management for the keystore.
# 3. Code Coverage: Verification of coverage (Jacoco/Kover) to be added in the future.
# 
# NOTE: This workflow MUST work without keystore.properties. If it fails, check signingConfigs in build.gradle.kts.
