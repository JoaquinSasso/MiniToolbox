# Nivel de SDK que Robolectric simula en los tests unitarios.
#
# El proyecto compila contra SDK 37, pero Robolectric sólo puede emular los niveles
# para los que existe un android-all publicado. Fijarlo acá evita que los tests se
# rompan cada vez que sube compileSdk.
#
# Si al correr los tests aparece "Unsupported I/O SDK" o similar, el mensaje de error
# lista los niveles disponibles: usar el más alto de esa lista.
sdk=35